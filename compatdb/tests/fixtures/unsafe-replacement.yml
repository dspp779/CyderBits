schema_version: 1

rules:
  - id: test.unsafe-replacement
    description: Replacement path must remain relative to the matched prefix.
    priority: 1
    enabled: true
    stability: experimental
    applies_to: {platform: macos, engine_api: 1}
    match:
      executable: {path_suffix: '\source.exe'}
    actions:
      replace_executable:
        path_suffix: '\..\target.exe'
    tests:
      matches:
        - name: source executable
          executable: 'C:\Fixture\source.exe'
          command_line: [source.exe]
      excludes: []
