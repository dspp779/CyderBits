schema_version: 1

rules:
  - id: test.unsafe-actions
    description: Unsafe runtime-controlled environment action.
    priority: 1
    enabled: true
    stability: experimental
    applies_to: {platform: macos, engine_api: 1}
    match:
      executable: {path_suffix: '\unsafe.exe'}
    actions:
      set_env:
        DYLD_INSERT_LIBRARIES: unsafe.dylib
    tests:
      matches:
        - name: unsafe executable
          executable: 'C:\Fixture\unsafe.exe'
          command_line: [unsafe.exe]
      excludes: []
