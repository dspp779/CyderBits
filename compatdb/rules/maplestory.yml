schema_version: 1

rules:
  - id: game.maplestory-classic.dxvk
    description: >
      Prefer DXVK for MapleStory Classic (Maplestory_Classic.exe) when no
      Cyder executable-specific platform policy has already selected a
      backend. Cyder itself selects DXMT on macOS 15+ and DXVK below macOS 15
      for MapleStory.exe and Maplestory_Classic.exe; this rule remains the
      direct-Wine/default fallback.
    priority: 100
    enabled: true
    stability: stable

    applies_to:
      platform: macos
      engine_api: 1

    match:
      executable:
        path_suffix: '\Maplestory_Classic.exe'

    actions:
      graphics_backend: dxvk

    tests:
      matches:
        - name: Direct CompatDB fallback selects DXVK for Classic
          executable: 'C:\Games\MapleStory Classic\Maplestory_Classic.exe'
          command_line:
            - Maplestory_Classic.exe
        - name: path casing does not matter for Classic EXE
          executable: 'Z:\Users\jjc\games\tms_cw\maplestory_classic.exe'
          command_line:
            - maplestory_classic.exe
      excludes:
        - name: Taiwan retail MapleStory.exe is unchanged by Classic rule
          executable: 'C:\MapleTest\MapleStory.exe'
          command_line:
            - MapleStory.exe
        - name: unrelated Unity game remains unchanged
          executable: 'C:\Games\Other\Game.exe'
          command_line:
            - Game.exe
