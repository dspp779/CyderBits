schema_version: 1

rules:
  - id: game.richman-4.cnc-ddraw
    description: Load the provisioned cnc-ddraw renderer for Richman 4.
    priority: 100
    enabled: true
    stability: experimental

    applies_to:
      platform: macos
      engine_api: 1

    match:
      executable:
        path_suffix: '\rich4.exe'

    actions:
      dll_overrides:
        ddraw: native,builtin

    tests:
      matches:
        - name: Richman 4 uses its provisioned native DirectDraw renderer
          executable: 'C:\Games\Richman 4\rich4.exe'
          command_line:
            - rich4.exe
      excludes:
        - name: another DirectDraw game remains unchanged
          executable: 'C:\Games\Other\game.exe'
          command_line:
            - game.exe

  # Issue #10: only DXMT draws CS2 (D3DMetal renders the city black; DXVK
  # stops at the main menu). A global or per-game graphics choice other than
  # "default" still wins: the launcher forces it through CYDER_GRAPHICS_BACKEND.
  # Does not start Steam, bypass a launcher, or modify game DLLs.
  - id: game.cities-skylines-2.dxmt
    description: Select DXMT for Cities Skylines II; not compatibility certification.
    priority: 100
    enabled: true
    stability: experimental
    applies_to:
      platform: macos
      engine_api: 1
    match:
      executable:
        path_suffix: '\Cities2.exe'
    actions:
      graphics_backend: dxmt
    tests:
      matches:
        - name: direct CS2 launch with spaces in its path
          executable: 'C:\Program Files (x86)\Steam\steamapps\common\Cities Skylines II\Cities2.exe'
          command_line: [Cities2.exe]
        - name: case insensitive executable selection
          executable: 'D:\Games\CITIES2.EXE'
          command_line: [CITIES2.EXE]
      excludes:
        - name: Paradox launcher remains unchanged
          executable: 'C:\Games\CS2\Launcher\bootstrapper-v2.exe'
          command_line: [bootstrapper-v2.exe]
        - name: original Cities Skylines remains unchanged
          executable: 'C:\Games\Cities.exe'
          command_line: [Cities.exe]
        - name: Steam remains unchanged
          executable: 'C:\Steam\steam.exe'
          command_line: [steam.exe]

  # MECCHA CHAMELEON (Steam 4704690, Unreal Engine 5). On DXVK 1.10.3 the
  # main-menu 3D scene stays black, with or without -dx11. DXMT and D3DMetal
  # draw it; -dx11 keeps UE5 off DirectX 12, which on D3DMetal costs about
  # twice the GPU time (M4: 8.3 ms vs 18.1 ms per frame). Where DXMT cannot
  # run, the launcher picks D3DMetal or DXVK instead of this backend
  # (cyder_apply_compatdb_dxmt_fallback). A graphics choice other than
  # "default" still wins.
  - id: game.meccha-chameleon.dxmt-dx11
    description: Run MECCHA CHAMELEON with DXMT and Direct3D 11; not compatibility certification.
    priority: 100
    enabled: true
    stability: experimental
    applies_to:
      platform: macos
      engine_api: 1
    match:
      executable:
        path_suffix: '\Chameleon\Binaries\Win64\PenguinHotel-Win64-Shipping.exe'
    actions:
      graphics_backend: dxmt
      append_args:
        args:
          - '-dx11'
        deduplicate: option
    tests:
      matches:
        - name: Steam install launched through the bootstrap
          executable: 'C:\Program Files (x86)\Steam\steamapps\common\MECCHA CHAMELEON\Chameleon\Binaries\Win64\PenguinHotel-Win64-Shipping.exe'
          command_line: [PenguinHotel-Win64-Shipping.exe, Chameleon]
        - name: player already passes -dx11
          executable: 'D:\Games\MECCHA CHAMELEON\Chameleon\Binaries\Win64\PenguinHotel-Win64-Shipping.exe'
          command_line: [PenguinHotel-Win64-Shipping.exe, Chameleon, -dx11]
      excludes:
        - name: the bootstrap itself is unchanged
          executable: 'C:\Program Files (x86)\Steam\steamapps\common\MECCHA CHAMELEON\PenguinHotel.exe'
          command_line: [PenguinHotel.exe]
        - name: crash reporter is unchanged
          executable: 'C:\Program Files (x86)\Steam\steamapps\common\MECCHA CHAMELEON\Engine\Binaries\Win64\CrashReportClient.exe'
          command_line: [CrashReportClient.exe]
        - name: another game's shipping binary is unchanged
          executable: 'C:\Games\Other\Binaries\Win64\Other-Win64-Shipping.exe'
          command_line: [Other-Win64-Shipping.exe]
